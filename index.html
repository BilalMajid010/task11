<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My JavaScript Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1 id="name"></h1>
        <h2 id="role"></h2>
        <p id="experience"></p>

        <section>
            <h2>About Me</h2>
            <p id="contact"></p>
            <p id="education"></p>
        </section>

        <section>
            <h2>My Skills</h2>
            <input type="text" id="skillSearch" placeholder="Search skills...">
            <ul id="skills"></ul>
            <p id="skillCount"></p>
        </section>

        <section>
            <h2>Skill Score</h2>
            <p id="score"></p>
        </section>

        <section>
            <h2>Projects</h2>
            <ul id="projects"></ul>
        </section>

        <section>
            <h2>Check My Profile</h2>
            <input type="text" id="userInput" placeholder="Enter a skill">
            <button id="checkButton">Check Skill</button>
            <p id="message"></p>
        </section>
    </div>
    <script src="app.js" defer></script>
</body>
</html>
